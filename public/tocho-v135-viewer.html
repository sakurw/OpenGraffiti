<!doctype html><html><head><meta charset="utf-8"><title>Tokyo Metropolitan Government Building v135</title></head><body style="margin:0;background:#222"><div style="position:fixed;color:white;z-index:2">Tokyo Metropolitan Government Building Photoreal v135</div><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x222222);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,100000);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
(function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)})();
</script></body></html>
