<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TYPE / WIPE — OpenGraffiti</title>
<link rel="stylesheet" href="./loading/type-wipe.css">
<style>
:root{font-family:"Yu Gothic UI",Meiryo,sans-serif;color-scheme:dark;--bg:#141611;--ink:#eceee2;--muted:#969c8c;--line:#34392e;--accent:#dcf66d;background:var(--bg);color:var(--ink)}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;flex-direction:column}body.light{color-scheme:light;--bg:#f0f1e9;--ink:#263023;--muted:#626b5c;--line:#cdd2c2;--accent:#263817}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 36px;padding:25px 0;border-bottom:1px solid var(--line)}.brand{font-size:14px;font-weight:800;letter-spacing:-.02em}.brand i{display:inline-block;background:var(--accent);width:8px;height:18px;transform:skew(-16deg);vertical-align:middle;margin-right:12px}.edition{font-size:10px;letter-spacing:.16em;color:var(--muted)}main{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:430px;padding:60px 20px 80px}.loader-frame{position:relative;width:100%;display:flex;justify-content:center}.og-type-wipe{gap:30px}.complete .og-type-wipe__mark{background:var(--accent)}.complete .og-type-wipe__light{display:none}.controls{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 0;border-top:1px solid var(--line);margin:0 36px 16px;font-size:11px;color:var(--muted)}.controls a{color:inherit;text-underline-offset:4px}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}button,select{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer}select option{background:var(--bg)}button:hover,select:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button[aria-pressed=true]{border-color:var(--accent)}.note{margin-right:10px}body.clean header,body.clean .controls{visibility:hidden}body.clean{cursor:none}@media(max-width:640px){header{margin:0 20px}.edition{font-size:9px}.controls{margin:0 20px 12px;flex-direction:column;align-items:flex-start;gap:16px}.actions{gap:6px}.note{width:100%}main{padding:55px 16px;min-height:340px}.og-type-wipe__mark{width:min(440px,88vw)}.og-type-wipe__label{font-size:11px}}
</style>
</head>
<body>
<header><div class="brand"><i></i>OpenGraffiti</div><div class="edition">TYPE / WIPE · STREET EDITION</div></header>
<main><div class="loader-frame"><div class="og-type-wipe" role="status" aria-live="polite"><div class="og-type-wipe__mark" aria-hidden="true"><i class="og-type-wipe__light"></i></div><div class="og-type-wipe__caption"><span class="og-type-wipe__label">街を準備しています</span><span class="og-type-wipe__detail">そのままお待ちください</span></div></div></div></main>
<footer class="controls"><a href="./loading-studies.html">← 都市・地形の案へ</a><div class="actions"><span class="note">完成版プレビュー</span><select id="duration" aria-label="確認用の待機時間"><option value="0">連続表示</option><option value="10">10秒で完了</option><option value="30">30秒で完了</option></select><button id="restart">最初から</button><button id="pause" aria-pressed="false">動きを停止</button><button id="theme" aria-pressed="false">明るい背景</button><button id="clean">表示のみ</button></div></footer>
<script>
const loader=document.querySelector('.og-type-wipe'),label=loader.querySelector('.og-type-wipe__label'),detail=loader.querySelector('.og-type-wipe__detail'),duration=document.querySelector('#duration'),pause=document.querySelector('#pause');
let elapsed=0,last=performance.now(),paused=false,complete=false;
function restart(){elapsed=0;last=performance.now();complete=false;document.body.classList.remove('complete');label.textContent='街を準備しています';detail.textContent='そのままお待ちください';loader.getAnimations({subtree:true}).forEach(a=>a.currentTime=0);}
document.querySelector('#restart').onclick=restart;duration.onchange=restart;
pause.onclick=()=>{paused=!paused;last=performance.now();loader.toggleAttribute('data-paused',paused);pause.setAttribute('aria-pressed',String(paused));pause.textContent=paused?'動きを再開':'動きを停止';};
document.querySelector('#theme').onclick=e=>{const light=document.body.classList.toggle('light');loader.classList.toggle('og-type-wipe--light',light);e.target.setAttribute('aria-pressed',String(light));e.target.textContent=light?'暗い背景':'明るい背景';};
document.querySelector('#clean').onclick=()=>document.body.classList.add('clean');
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('clean');});
document.addEventListener('pointerdown',()=>{if(document.body.classList.contains('clean'))document.body.classList.remove('clean');},true);
setInterval(()=>{const now=performance.now();if(!paused&&!complete)elapsed+=now-last;last=now;if(!complete&&Number(duration.value)>0&&elapsed>=Number(duration.value)*1000){complete=true;document.body.classList.add('complete');label.textContent='街の準備ができました';detail.textContent='';}else if(!complete&&elapsed>=8000&&detail.textContent!=='もう少し時間がかかっています'){detail.textContent='もう少し時間がかかっています';}},200);
</script>
</body></html>
