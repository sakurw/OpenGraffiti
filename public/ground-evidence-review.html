<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,"><title>都庁・外部画像の根拠確認</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,"Yu Gothic UI",sans-serif;background:#12191e;color:#f3f6f7;height:100vh;display:flex;flex-direction:column}
    header{padding:16px 22px;display:flex;gap:20px;align-items:center;border-bottom:1px solid #354047}
    h1{font-size:20px;margin:0}p{margin:3px 0;color:#bac7cf}.coverage{margin-left:auto;font-size:24px;font-weight:650;white-space:nowrap}
    nav{padding:10px 22px;display:flex;gap:8px;align-items:center}button{font:inherit;background:#263943;color:#edf4f7;border:1px solid #4e6571;border-radius:5px;padding:6px 16px;cursor:pointer}
    main{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#586369;flex:1;min-height:0}.pane{min-width:0;min-height:0;background:#1b252d;display:flex;flex-direction:column}.pane h2{font-size:15px;margin:0;padding:10px 16px}
    .view{flex:1;min-height:0;position:relative;background:#e9edf0}.view canvas{display:block;width:100%;height:100%;touch-action:none}
    .sources{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;max-width:calc(100% - 24px);overflow-x:auto}.source{flex:0 0 100px;padding:4px;background:#172730dc;color:white;font-size:10px;text-decoration:none;border-radius:6px}.source img{width:100%;height:100px;object-fit:cover;display:block}
    footer{padding:10px 22px;font-size:12px;color:#c1ced5}a{color:#a8d5f0}#status{margin-left:auto}#error{display:none;color:#fff;background:#902d2d;padding:16px;white-space:pre-wrap}
    @media(max-width:900px){header{padding:10px}.coverage{font-size:20px}h1{font-size:16px}footer{font-size:11px}}
  </style>
  <script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head>
<body>
  <header><div><h1>都庁第一本庁舎・外部画像の根拠確認</h1><p>検証中。写真で確認できた部分を元のモデルに反映しています。灰色は未確認部分です。</p></div><div class="coverage" id="coverage">計測結果を読込中</div></header>
  <nav><button data-view="southwest">南西</button><button data-view="northwest">北西</button><button data-view="east">東</button><button data-view="upper">上層部</button><span id="status">モデル読込中 0/2</span></nav>
  <div id="error" role="alert"></div>
  <main><section class="pane"><h2>無着色・テクスチャなし</h2><div class="view" id="neutral"></div></section><section class="pane"><h2>位置合わせを検証した地上写真を反映</h2><div class="view" id="external"></div></section></main>
  <footer><div id="measurement"></div><div id="attribution"><a href="https://www.geospatial.jp/ckan/dataset/plateau-13104-shinjuku-ku-2025" target="_blank" rel="noopener">3D都市モデル（Project PLATEAU / 新宿区2025）を加工</a>　</div><div>回転：左ドラッグ ／ 移動：右ドラッグ ／ 拡大縮小：ホイール。左右の視点は同期します。</div></footer>
  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
    import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
    const base='/assets/ground-evidence/bldg_94caaf2f-dec2-41a7-8b0f-06ecd0fac6c7';
    const state=window.__GROUND_EVIDENCE__={loaded:0,panes:{},error:null};
    function fail(error){state.error=String(error);const box=document.querySelector('#error');box.style.display='block';box.textContent='表示に失敗しました: '+error;document.querySelector('#status').textContent='読込失敗';}
    window.addEventListener('error',event=>fail(event.message));
    window.addEventListener('unhandledrejection',event=>fail(event.reason));
    try{
      const response=await fetch(base+'/report.json',{cache:'no-store'});if(!response.ok)throw Error('計測結果 HTTP '+response.status);
      const report=await response.json();state.coverage=report.strictExternalAreaCoverage;
      document.querySelector('#coverage').textContent=(report.strictExternalAreaCoverage*100).toFixed(2)+'% / 目標 >90%';
      document.querySelector('#measurement').textContent=`外壁面積 ${report.totalWallAreaSquareMetres.toLocaleString('ja-JP',{maximumFractionDigits:1})} m² のうち、外部画像の確認済み面積 ${report.externalEvidenceAreaSquareMetres.toLocaleString('ja-JP',{maximumFractionDigits:1})} m²。航空写真・推測による塗り分けは根拠率に含めません。`;
      const credit=document.querySelector('#attribution');
      for(const source of report.sources){const a=document.createElement('a');a.href=source.sourcePage;a.target='_blank';a.rel='noopener';a.textContent=`Wikimedia Commons / ${source.author} / ${source.license}`;credit.append(a,document.createTextNode('　'));}
      const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder),panes=[];let syncing=false;
      for(const key of ['neutral','external']){
        const element=document.getElementById(key),renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor(0xe9edf0);element.append(renderer.domElement);
        const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,.5,5000),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=false;controls.zoomToCursor=true;controls.minDistance=40;controls.maxDistance=1500;controls.zoomSpeed=2;controls.panSpeed=2;
        scene.add(new THREE.HemisphereLight(0xffffff,0xc4c9d0,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-200,500,300);scene.add(light);
        const gltf=await loader.loadAsync(base+'/'+key+'.glb');let meshes=0,vertices=0,textured=0;
        gltf.scene.traverse(object=>{if(object.isMesh){meshes++;vertices+=object.geometry.attributes.position.count;if(object.material.map)textured++;}});
        if(!meshes||!vertices)throw Error(key+' モデルの形状が空です');if(key==='external'&&report.externalEvidenceAreaSquareMetres>0&&!textured)throw Error('反映済みテクスチャがありません');
        scene.add(gltf.scene);const pane={key,element,renderer,scene,camera,controls};panes.push(pane);state.panes[key]={meshes,vertices,textured};state.loaded++;document.querySelector('#status').textContent=`モデル表示 ${state.loaded}/2`;
        const resize=()=>{const rect=element.getBoundingClientRect();renderer.setSize(rect.width,rect.height,false);camera.aspect=rect.width/rect.height;camera.updateProjectionMatrix();renderer.render(scene,camera);};new ResizeObserver(resize).observe(element);
        controls.addEventListener('change',()=>{if(syncing)return;syncing=true;for(const other of panes){if(other!==pane){other.camera.position.copy(camera.position);other.controls.target.copy(controls.target);other.camera.quaternion.copy(camera.quaternion);other.controls.update();}other.renderer.render(other.scene,other.camera);}syncing=false;});
      }
      function view(name){const preset={southwest:[[-350,240,350],[0,160,10]],northwest:[[-350,240,-330],[0,160,10]],east:[[420,240,40],[0,160,10]],upper:[[-190,250,190],[0,237,10]]}[name];syncing=true;for(const pane of panes){pane.camera.position.set(...preset[0]);pane.controls.target.set(...preset[1]);pane.controls.update();const rect=pane.element.getBoundingClientRect();pane.renderer.setSize(rect.width,rect.height,false);pane.camera.aspect=rect.width/rect.height;pane.camera.updateProjectionMatrix();pane.renderer.render(pane.scene,pane.camera);}syncing=false;state.view=name;}
      document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>view(button.dataset.view)));
      const sources=document.createElement('div');sources.className='sources';
      for(const source of report.sources){const a=document.createElement('a');a.className='source';a.href=base+'/source-'+source.id+'.jpg';a.target='_blank';a.rel='noopener';const img=document.createElement('img');img.src=base+'/thumb-'+source.id+'.jpg';img.alt='位置合わせに使用した地上写真 '+source.id;a.append(img,document.createTextNode('実写真 '+source.id+' を開く'));sources.append(a);}
      document.querySelector('#external').append(sources);
      view('southwest');state.ready=true;
    }catch(error){fail(error);}
  </script>
</body>
</html>
