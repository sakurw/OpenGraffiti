<!doctype html>
<html><body style="margin:0;background:#202020;color:white;font-family:sans-serif">
<div id="status" style="position:fixed;z-index:2;padding:8px;background:#000c">都庁品質比較: 読み込み中</div>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from '/vendor/GLTFLoader.js';
import {OrbitControls} from '/vendor/OrbitControls.js';
import {MeshoptDecoder} from '/vendor/meshopt_decoder.module.js';
const files=['/assets/tocho-landmark/tocho-plateau-original.glb','/assets/tocho-landmark/tocho-landmark-native-hybrid.glb','/assets/tocho-landmark/tocho-landmark-photo-mechanical-hybrid-v41-candidate-20261012.glb','/assets/tocho-landmark/tocho-landmark-photo-support-hybrid-v45-candidate-20261012.glb'];
const names=['PLATEAU元テクスチャ','写真観測+建築推定 native','写真+機械推定 v41','写真+支持平面推定 v45'];
const scene=new THREE.Scene();scene.background=new THREE.Color(0x202020);

function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}loop();
</script></body></html>
