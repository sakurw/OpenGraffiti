<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>新MSLSデータセットと既存モデルの比較</title>
<style>body{margin:0;font:15px/1.6 system-ui;background:#f6f6f0;color:#24312e}header{padding:12px 20px;border-bottom:1px solid #ccd3c8}h1{font-size:20px;margin:0}main{display:grid;grid-template-columns:minmax(320px,38%) 1fr;height:calc(100vh - 160px)}aside{padding:16px;overflow:auto}iframe{width:100%;height:100%;border:0;background:white}img{width:100%;height:auto;max-height:50vh;object-fit:contain;background:#dde1d7}select,button{padding:8px;margin:4px 0;max-width:100%}select#photo{width:100%}p{margin:6px 0}.notice{color:#825213}a{color:#17615d}pre{white-space:pre-wrap;font:12px/1.5 monospace;word-break:break-all}@media(max-width:900px){main{display:block}iframe{height:700px}}</style>
<header><h1>新MSLS写真 ／ 既存3Dモデル</h1><p id="status" role="status">読み込み中</p><p class="notice">実画像の比較です。写真と3Dの視点は未同期です。写真の緯度経度は撮影地点であり、写っている建物の確定位置ではありません。</p><a href="assets/texture-poc/msls/LICENSE.txt">付属ライセンス原文</a> · <a href="https://github.com/mapillary/mapillary_sls">公式データセット説明</a> · ローカル試行用（非商用条件・原文内の名称とリンクの不一致に注意。外部公開未実施）</header>
<main><aside><label>地域 <select id="area"><option value="tokyo-tower">東京タワー周辺</option><option value="tocho">都庁周辺</option></select></label><br><label>撮影列 <select id="sequence"></select></label><br><label>写真 <select id="photo"></select></label><button id="previous">前の写真</button> <button id="next">次の写真</button><img id="image" alt="選択したMSLS原画像"><p id="details"></p><p class="notice">原画像は640px幅です。樹木・車・歩行者や年代差があり、画像全体をそのまま壁へ貼ることはできません。</p><pre id="provenance"></pre></aside><section><iframe id="model" title="元PLATEAU・MSLS試行・既存Mapillaryの3D比較"></iframe></section></main>
<script type="module">
const $=id=>document.getElementById(id);const response=await fetch('assets/texture-poc/msls/photos.json');if(!response.ok)throw Error('MSLS report unavailable');const data=await response.json();let list=[];
const option=(value,text)=>{const e=document.createElement('option');e.value=value;e.textContent=text;return e;};
function image(){const p=list.find(p=>p.id===$('photo').value);if(!p)return;$('image').src=`assets/texture-poc/msls/images/${encodeURIComponent(p.id)}.jpg`;$('details').textContent=`${p.date} ／ ${p.size.join('×')}px ／ 緯度 ${p.lat}・経度 ${p.lon} ／ 方位 ${p.heading.toFixed(1)}°（記録値）`;$('provenance').textContent=`MSLS / Mapillary contributors\n画像ID: ${p.id}\n撮影列: ${p.sequence}\nSHA256: ${p.sha256}\nZIP内: ${p.entry}\nこの一覧は取得画像です。反映済み件数は右の投影報告を参照。`;}
function sequence(){list=data.photos.filter(p=>p.areas.includes($('area').value)&&p.sequence===$('sequence').value).sort((a,b)=>a.frame-b.frame);$('photo').replaceChildren(...list.map(p=>option(p.id,`${p.frame} · ${p.date} · ${p.id}`)));image();}
function area(){const local=data.photos.filter(p=>p.areas.includes($('area').value));const ids=[...new Set(local.map(p=>p.sequence))];$('sequence').replaceChildren(...ids.map(id=>option(id,`${id} (${local.filter(p=>p.sequence===id).length}枚)`)));$('status').textContent=`全934枚を抽出・原画像照合済み ／ 選択地域 ${local.length}枚。自動投影は別途検証した一部のみ。`;$('model').src=`/texture-city?snap=msls&embed=1&selection=wall-coverage-refine2-all&area=${$('area').value}`;sequence();}
$('area').onchange=area;$('sequence').onchange=sequence;$('photo').onchange=image;for(const [id,delta] of [['previous',-1],['next',1]])$(id).onclick=()=>{$('photo').selectedIndex=($('photo').selectedIndex+delta+list.length)%list.length;image();};area();
</script></html>
