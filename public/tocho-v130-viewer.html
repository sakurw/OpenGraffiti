<!doctype html><html><head><meta charset="utf-8"><title>Tocho v130</title><style>body{margin:0;background:#222}canvas{display:block}</style></head><body><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x222222);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,5000); camera.position.set(0,100,250);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.2; document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2));
const controls=new OrbitControls(camera,renderer.domElement);
const loader=new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
loader.load('/data/texture-city/tocho-photoreal-v130-material-split.glb',g=>{const m=g.scene; scene.add(m); const box=new THREE.Box3().setFromObject(m); const c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3()); m.position.sub(c); const max=Math.max(s.x,s.y,s.z); camera.position.set(max*.8,max*.5,max*.8); camera.lookAt(0,0,0); controls.target.set(0,0,0); controls.update(); console.log('loaded',s);},undefined,e=>console.error(e));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}); function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)} loop();
</script></body></html>
