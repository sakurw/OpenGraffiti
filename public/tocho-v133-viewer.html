<!doctype html>
<html><head><meta charset="utf-8"><title>Tocho v133</title><style>body{margin:0;background:#222;color:#fff;font-family:sans-serif}#info{position:fixed;top:10px;left:10px;z-index:2}canvas{display:block}</style></head>
<body><div id="info">Tokyo Metropolitan Government Building v133</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x222222);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,10000);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2));
const controls=new OrbitControls(camera,renderer.domElement);
const loader=new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
loader.load('./data/texture-city/tocho-photoreal-v133-fingerprint-rebind.glb',g=>{
 scene.add(g.scene);
 const box=new THREE.Box3().setFromObject(g.scene); const center=box.getCenter(new THREE.Vector3());
 const size=box.getSize(new THREE.Vector3()).length();
 controls.target.copy(center); camera.position.copy(center).add(new THREE.Vector3(size*0.18,size*0.12,size*0.18));
 camera.near=Math.max(size/1000,0.1); camera.far=size*10; camera.updateProjectionMatrix(); controls.update();
},undefined,e=>console.error(e));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)} loop();
</script></body></html>
