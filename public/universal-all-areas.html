<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLATEAU 2地区 全棟着色比較</title>
<style>body{margin:0;background:#eef2ef;color:#18332d;font:15px system-ui,'Yu Gothic UI',sans-serif}header{padding:18px 24px}h1{font-size:24px;margin:0 0 10px}p{margin:8px 0;line-height:1.6}button{padding:9px 16px;border:1px solid #718c7d;border-radius:8px;background:white;cursor:pointer;margin-right:10px}button[aria-pressed=true]{background:#276e5b;color:white}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px}.panel{background:white;border-radius:12px;padding:12px;min-width:0}h2{font-size:17px;margin:0 0 9px}.viewport{height:72vh;min-height:420px;background:#e4ebe5;border-radius:8px;overflow:hidden}.viewport canvas{display:block;width:100%;height:100%}#status{font-size:13px;margin-left:6px}small{display:block;margin-top:8px;color:#53675b}@media(max-width:800px){.views{grid-template-columns:1fr}.viewport{height:55vh}}</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script></head><body><header><h1>PLATEAU 都庁周辺・東京タワー周辺 全棟比較</h1><button data-area="tocho" aria-pressed="true">都庁周辺 1,600棟</button><button data-area="tokyo-tower" aria-pressed="false">東京タワー周辺 1,258棟</button><span id="status">読込中</span><p>右の表示：<button data-mode="fusion" aria-pressed="true">外部写真色推定＋元テクスチャ保持</button><button data-mode="appearance" aria-pressed="false">PLATEAU色調補正のみ</button><button data-mode="inferred" aria-pressed="false">外部写真・属性の推定色（UVなし）</button></p><p>左：PLATEAU元モデル／右：選択した処理結果。ドラッグで回転・ホイールでズーム（左右同期）。</p><small>写真色推定＋元テクスチャ保持版は、PLATEAU元モデルの形状・UV・窓・設備・画像を維持して、Mapillary候補画像の複数写真から推定した壁色を弱く補正。写真内の建物特定・カメラ幾何登録は未実施のため、直接観測色とは扱いません。推定色（UVなし）版は航空画像と地上画像・属性による補完を表示します。</small></header><main class="views"><section class="panel"><h2>PLATEAU 元モデル</h2><div class="viewport" id="before"></div></section><section class="panel"><h2 id="right-title">外部写真色推定＋元テクスチャ保持（全棟）</h2><div class="viewport" id="after"></div></section></main>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from '/vendor/GLTFLoader.js';import {OrbitControls} from '/vendor/OrbitControls.js';import {MeshoptDecoder} from '/vendor/meshopt_decoder.module.js';
const loader=new GLTFLoader();loader.setMeshoptDecoder(MeshoptDecoder);const views=[];let generation=0,syncing=false,selectedArea='tocho',selectedMode='fusion';
for(const id of ['before','after']){const host=document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0xe4ebe5);const camera=new THREE.PerspectiveCamera(48,1,.2,12000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));host.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=false;controls.addEventListener('change',()=>{if(syncing)return;syncing=true;for(const other of views){if(other.controls===controls)continue;other.camera.position.copy(camera.position);other.controls.target.copy(controls.target);other.camera.quaternion.copy(camera.quaternion);other.controls.update()}syncing=false});views.push({id,host,scene,camera,renderer,controls,root:null});}
function render(){requestAnimationFrame(render);for(const v of views){const w=v.host.clientWidth,h=v.host.clientHeight;if(v.renderer.domElement.width!==Math.floor(w*v.renderer.getPixelRatio())||v.renderer.domElement.height!==Math.floor(h*v.renderer.getPixelRatio())){v.renderer.setSize(w,h,false);v.camera.aspect=w/h;v.camera.updateProjectionMatrix()}v.renderer.render(v.scene,v.camera)}}render();
function disposeModel(root){const geometries=new Set(),materials=new Set(),textures=new Set();root.traverse(o=>{if(!o.isMesh)return;if(o.geometry)geometries.add(o.geometry);for(const m of (Array.isArray(o.material)?o.material:[o.material]))if(m)materials.add(m)});for(const material of materials){for(const value of Object.values(material))if(value?.isTexture)textures.add(value);material.dispose()}for(const texture of textures)texture.dispose();for(const geometry of geometries)geometry.dispose()}
const status=document.getElementById('status');async function load(area=selectedArea,mode=selectedMode){if(area===selectedArea&&mode===selectedMode&&(window.__allAreas?.loaded||window.__loadingKey===area+'|'+mode))return;window.__loadingKey=area+'|'+mode;selectedArea=area;selectedMode=mode;const token=++generation;status.textContent='モデル読込中…';document.querySelectorAll('button[data-area]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.area===area)));document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));document.getElementById('right-title').textContent=mode==='fusion'?'外部写真色推定＋元テクスチャ保持（全棟）':mode==='appearance'?'PLATEAU色調補正のみ（全棟）':'写真候補・属性の推定色（UVなし）';try{const [report,perBuilding,fusion]=await Promise.all([fetch('/assets/universal-all-areas/report.json').then(r=>r.json()),fetch('/assets/universal-all-areas/per-building-report.json').then(r=>{if(!r.ok)throw Error('建物別モデル未生成');return r.json()}),fetch('/assets/universal-all-areas/photo-fusion-report.json').then(r=>{if(!r.ok)throw Error('写真補正モデル未生成');return r.json()})]);const entry=report.areas.find(a=>a.areaId===area),inferred=perBuilding.areas.find(a=>a.areaId===area);if(!entry||!inferred)throw Error('area missing');const photoEntry=fusion.areas.find(a=>a.area===area);if(!photoEntry)throw Error('photo fusion missing');const models=await Promise.all([entry.baseline,mode==='fusion'?photoEntry.model:mode==='appearance'?entry.model:inferred.model].map(url=>new Promise((resolve,reject)=>loader.load(url,g=>resolve(g.scene),undefined,reject))));if(token!==generation){for(const model of models)disposeModel(model);return}models.forEach((model,i)=>{const v=views[i];if(v.root){v.scene.remove(v.root);disposeModel(v.root)}v.root=model;v.scene.add(model)});const box=new THREE.Box3().setFromObject(models[0]),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),radius=Math.max(size.x,size.y,size.z);for(const v of views){v.controls.target.copy(center);v.camera.position.copy(center).add(new THREE.Vector3(radius*.55,radius*.48,radius*.62));v.camera.near=Math.max(.1,radius/10000);v.camera.far=radius*15;v.camera.updateProjectionMatrix();v.controls.update()}window.__allAreas={loaded:true,area,mode,buildingCount:inferred.buildingCount,meshCount:models.map(m=>{let count=0;m.traverse(o=>{if(o.isMesh)count++});return count}),geometryUvIdentical:mode!=='inferred',photoFusedBuildings:photoEntry.buildingsWithEligiblePhotoAlbedo,perBuilding:true,summary:inferred.summary};window.__loadingKey=null;status.textContent=`${inferred.buildingCount.toLocaleString()}棟 / ${inferred.summary.polygons.toLocaleString()}面 / ${mode==='inferred'?'元UVなし':'元UV保持'} / 写真推定 ${photoEntry.buildingsWithEligiblePhotoAlbedo.toLocaleString()}棟`; }catch(error){console.error(error);status.textContent=`エラー: ${error.message}`;window.__allAreas={loaded:false,error:String(error)};window.__loadingKey=null}}
document.querySelectorAll('button[data-area]').forEach(b=>b.addEventListener('click',()=>load(b.dataset.area)));document.querySelectorAll('button[data-mode]').forEach(b=>b.addEventListener('click',()=>load(selectedArea,b.dataset.mode)));load('tocho','fusion');
</script></body></html>
